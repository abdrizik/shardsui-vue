<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --color-gray-500: oklch(12% 7.5% 264deg / 50%);
        --color-gray-900: oklch(12% 5% 264deg / 90%);
        --color-vue: #41b883;
        --font-sans: ui-sans-serif, system-ui, sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        width: 1200px;
        height: 630px;
        flex-direction: column;
        justify-content: space-between;
        background-color: #fff;
        padding: 88px;
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      .mark {
        width: 76px;
        height: 76px;
        color: var(--color-vue);
      }

      h1 {
        max-width: 22ch;
        font-size: 76px;
        font-weight: 600;
        letter-spacing: -0.035em;
        text-wrap: balance;
        color: var(--color-gray-500);
      }

      .name {
        color: var(--color-gray-900);
      }

      .vue-lockup {
        display: inline-flex;
        align-items: center;
        gap: 0.28em;
        white-space: nowrap;
        vertical-align: baseline;
        color: var(--color-vue);
      }

      .vue-lockup svg {
        display: inline-block;
        width: auto;
        height: 0.9em;
        vertical-align: -0.08em;
      }
    </style>
  </head>
  <body>

      />
      <path
        d="M14.0098 13.3154C11.8866 13.3154 10.1641 15.0349 10.1641 17.1577C10.1641 19.2806 11.8866 21 14.0098 21C16.1329 21 17.8555 19.2806 17.8555 17.1577C17.8555 15.0349 16.1329 13.3154 14.0098 13.3154Z"
      />
    </svg>

    <div>
      <h1>
        <span class="name">ShardsUI.</span> Unstyled, accessible UI components for
        <span class="vue-lockup"
          ><svg viewBox="0 0 261.76 226.69" aria-hidden="true">
            <path
              fill="#41b883"
              d="M161.096.001l-30.225 52.351L100.647.001H-.005l130.877 226.688L261.749.001z"
            />
            <path
              fill="#34495e"
              d="M161.096.001l-30.225 52.351L100.647.001H52.346l78.526 136.01L209.398.001z"
            />
          </svg>
          Vue</span
        >
      </h1>
    </div>
  </body>
</html>
