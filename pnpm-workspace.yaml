packages:
  - packages/*
  - docs

allowBuilds:
  esbuild: true

catalogs:
  dev:
    typescript: ^6.0.3
    vite: ^8.3.0
    vue: ^3.5.42
    vue-tsc: ^3.3.11
    '@vitejs/plugin-vue': ^6.0.8

minimumReleaseAgeExclude:
  - '@comark/vue@0.7.0'
  - comark@0.7.0

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
